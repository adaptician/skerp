<ul class="typeahead-menu" role="listbox" [id]="listId()" [attr.aria-label]="label()">
  @for (option of options(); track option.id; let index = $index) {
    <li
      class="typeahead-menu__option"
      role="option"
      tabindex="-1"
      [id]="listId() + '-' + index"
      [class.typeahead-menu__option--active]="index === activeIndex()"
      [attr.aria-selected]="index === activeIndex()"
      (mousedown)="keepFocus($event)"
      (click)="selected.emit(option)"
      (keydown.enter)="selected.emit(option)"
    >
      <span class="typeahead-menu__primary">{{ option.primary }}</span>
      @if (option.secondary) {
        <span class="typeahead-menu__secondary">{{ option.secondary }}</span>
      }
    </li>
  }
</ul>
